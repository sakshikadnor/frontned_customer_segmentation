

<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Customer Segmentation</title>

<link rel="stylesheet" href="customer.css">


</head>

<body>

<div class="container">

    <h1>Customer Segmentation</h1>

    <br>

    <p>Find your customer segment based on income and spending score.</p>

    <br>

    <form id="customer_form">

        <label>Annual Income</label>

        <input type="number"
               name="annual_income"
               placeholder="Enter Annual Income"
               required>

        <br><br>

        <label>Spending Score</label>

        <input type="number"
               name="spending_score"
               placeholder="Enter Spending Score"
               required>

        <br><br>

        <button type="submit">Find My Segment</button>

    </form>
    <p id="result"></p>
<script src="script.js"></script>
</div>




</body>

</html>
